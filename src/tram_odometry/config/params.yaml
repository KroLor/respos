# Параметры ноды резервной одометрии трамвая (tram_odometry)
# Дробные значения записаны с точкой: ROS строго проверяет тип параметра
tram_odometry:
  ros__parameters:
    # Оценщик скорости и положения:
    #   wheel_baseline   — базовый: скорость по тележкам, путь — интеграл скорости
    #   gnss_passthrough — ТОЛЬКО для проверки конвейера: берёт данные GNSS (для сдачи запрещён)
    # Для любого оценщика, кроме wheel_baseline, параллельно работает запасной wheel_baseline
    estimator: "wheel_baseline"

    # --- Входные данные ---
    # Трамвай. Датчики скорости колёс пишут км/ч, оценщики работают в м/с; масштаб откалиброван
    # по координатам GNSS для каждого трамвая (износ колёс):
    #   30618 — путь колёс / путь GNSS = 3,5940 (60 прогонов, 300 км) — на скрытой проверке он
    #   30639 — 3,6095 (18 прогонов, 85 км)
    # Для неизвестного трамвая — номинальный 1/3,6 (с предупреждением в логе)
    vehicle_id: "30618"
    # Множитель км/ч → м/с вручную; 0.0 — откалиброванный для vehicle_id
    wheel_speed_scale: 0.0
    # Скорость колеса выше этого значения (км/ч) заведомо неверна — отбрасывается
    wheel_speed_max_kmh: 120.0
    # Скорость от -этого значения до 0 (км/ч) — шум датчика около нуля (в данных до -0,4), обнуляется;
    # ниже — отбрасывается
    wheel_negative_tolerance_kmh: 1.0
    # Измерение колеса помечается подозрительным (не отбрасывается, решает оценщик), если:
    #   скорость меняется быстрее suspicious_accel (м/с²) с запасом suspicious_margin_kmh (км/ч) на шум,
    #   или тележки расходятся больше bogie_mismatch_kmh (км/ч)
    # В данных так ведут себя ~0,01–0,1 % измерений: юз, буксование, сбой датчика
    suspicious_accel: 3.0
    suspicious_margin_kmh: 1.0
    bogie_mismatch_kmh: 3.0
    # Измерение старше этого времени (с) считается устаревшим
    wheel_timeout: 0.5

    # --- Метки времени ---
    # Для каждого входа метка должна расти (так при перемешанных потоках берутся самые свежие данные)
    # Метка, убежавшая вперёд больше чем на stamp_max_lead (с) и от своей предыдущей, и от других входов, —
    # мусорная и отбрасывается; откат больше stamp_max_lag (с) — возможная смена отсчёта времени.
    # stamp_resync_count согласованных таких меток подряд — переход на новый отсчёт
    stamp_max_lead: 5.0
    stamp_max_lag: 5.0
    stamp_resync_count: 5

    # --- Публикация ---
    # Публикация идёт по сообщениям контроллера (~20 Гц); если он молчит дольше
    # этого времени (с, по времени bag) — по сообщениям колёс (~9,4 Гц)
    driver_cmd_timeout: 0.15
    # Системы координат в /result/position (header.frame_id и child_frame_id)
    frame_id: "map"
    child_frame_id: "base_link"

    # --- Синхронизация по времени ---
    # Метка результата — метка сообщения контроллера, а последнее измерение колёс к этому моменту
    # старше на 40–150 мс. Измерение пересчитывается по ускорению на момент (метка − speed_time_offset).
    # Подбор по 86 прогонам с GNSS: лучший speed_time_offset = 0.0 с — RMSE скорости 0,145 → 0,136 м/с,
    # смещение на разгоне −0,067 → +0,003 м/с, на торможении +0,072 → +0,007 м/с
    wheel_time_alignment: true
    speed_time_offset: 0.0

    # --- Оценщики ---
    # Запасной оценщик при расхождении тележек: тележка с почти нулевой скоростью игнорируется,
    # иначе берётся та, что ближе к прогнозу скорости. Расхождение дольше этого времени (с) —
    # отказ датчика, берётся большая скорость (настоящие проскальзывания в данных — не дольше 1,7 с)
    bogie_mismatch_max_duration: 3.0
    # Без данных колёс скорость удерживается wheel_hold_max (с), затем снижается
    # с постоянной времени wheel_decay_tau (с), чтобы путь не «убегал» при долгом отказе датчиков
    wheel_hold_max: 2.0
    wheel_decay_tau: 5.0
    # Скорость от оценщика выше этого значения (м/с) или не число — сбой, результат берётся у запасного
    max_output_speed: 30.0

    # --- Диагностика ---
    # Период публикации /diagnostics, с (0.0 — выключить)
    diagnostics_period: 1.0
    # Период вывода статуса в лог, с (0.0 — выключить)
    status_period: 5.0
