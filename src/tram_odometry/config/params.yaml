# Параметры ноды резервной одометрии трамвая (tram_odometry)
# Дробные значения записаны с точкой: ROS строго проверяет тип параметра
tram_odometry:
  ros__parameters:
    # Оценщик скорости и положения:
    #   backup_model     — основной: модель движения пакета tram_backup_odometry (фильтр Калмана
    #                      по тележкам с моделью привода, карта пути); положение base_link в MGRS
    #   wheel_baseline   — простой: скорость по тележкам, путь — интеграл скорости; положение в
    #                      локальной ENU от первой точки GNSS (для судьи не подходит, это запасной)
    #   gnss_passthrough — ТОЛЬКО для проверки конвейера: берёт данные GNSS (для сдачи запрещён)
    # Для любого оценщика, кроме wheel_baseline, параллельно работает запасной wheel_baseline
    estimator: "backup_model"

    # --- Модель движения (backup_model): параметры пакета tram_backup_odometry ---
    # Каталог данных модели (config/model.json, config/esn.json, data/pathgraph.json и соседние файлы
    # карты); "" — из установленного пакета tram_backup_odometry
    backup_model_share: ""
    # Параметры модели — поля Params (tram_backup_odometry/estimator.py) с префиксом model., полный
    # список и смысл — src/tram_backup_odometry/README.md, §5. Модели передаются только значения,
    # отличные от её умолчаний; масштаб колёс и пути — из калибровки config/model.json.
    # Ниже — умолчания модели для самых востребованных параметров. Дробные — с точкой.
    model:
      # Начальная позиция без GNSS в начале прогона (плоские MGRS судьи, м; курс — рад от оси x):
      # по умолчанию не задана, тогда без GNSS — относительная одометрия от стартовой точки.
      # Пример: init_x: 5431.2, init_y: 4302.7, init_yaw: 1.57
      # Вагон: пересчёт удельной силы привода в момент и обороты вала двигателя (/diagnostics);
      # на скорость и положение не влияют
      mass_kg: 42000.0
      wheel_radius_m: 0.33
      gear_ratio: 7.0
      drive_efficiency: 0.95
      n_motors: 1
      # Ограничение ускорения по сцеплению колеса с рельсом: |a| ≤ μ·g
      adhesion_mu: 0.3
      # Отбраковка показаний колёс: гейт невязки (σ и не меньше, м/с), выход ускорения колеса за
      # физическую огибающую (проскальзывание, м/с²), залипание (одинаковых показаний подряд)
      gate_sigma: 3.0
      gate_min: 0.35
      slip_accel_margin: 0.5
      frozen_n: 5
      # Фильтр: kf — фильтр Калмана с отбраковкой, imm — IMM из трёх UKF; шум модели и колёс
      filter: "kf"
      q_accel: 0.2
      r_wheel: 0.05
      # Эхо-сеть в модели динамики; карта пути; коррекция на остановках; адаптация масштаба колёс
      use_esn: true
      use_map: true
      stop_correction: true
      scale_adapt: true

    # --- Входные данные ---
    # Трамвай. Датчики скорости колёс пишут км/ч, оценщики работают в м/с; масштаб откалиброван
    # по координатам GNSS для каждого трамвая (износ колёс):
    #   30618 — путь колёс / путь GNSS = 3,5940 (60 прогонов, 300 км) — на скрытой проверке он
    #   30639 — 3,6095 (18 прогонов, 85 км)
    # Для неизвестного трамвая — номинальный 1/3,6 (с предупреждением в логе)
    vehicle_id: "30618"
    # Множитель км/ч → м/с вручную; 0.0 — откалиброванный для vehicle_id
    wheel_speed_scale: 0.0
    # Скорость колеса выше этого значения (км/ч) заведомо неверна — отбрасывается
    wheel_speed_max_kmh: 120.0
    # Скорость от -этого значения до 0 (км/ч) — шум датчика около нуля (в данных до -0,4), обнуляется;
    # ниже — отбрасывается
    wheel_negative_tolerance_kmh: 1.0
    # Измерение колеса помечается подозрительным (не отбрасывается, решает оценщик), если:
    #   скорость меняется быстрее suspicious_accel (м/с²) с запасом suspicious_margin_kmh (км/ч) на шум,
    #   или тележки расходятся больше bogie_mismatch_kmh (км/ч)
    # В данных так ведут себя ~0,01–0,1 % измерений: юз, буксование, сбой датчика
    suspicious_accel: 3.0
    suspicious_margin_kmh: 1.0
    bogie_mismatch_kmh: 3.0
    # Измерение старше этого времени (с) считается устаревшим
    wheel_timeout: 0.5

    # --- Метки времени ---
    # Для каждого входа метка должна расти (так при перемешанных потоках берутся самые свежие данные)
    # Метка, убежавшая вперёд больше чем на stamp_max_lead (с) и от своей предыдущей, и от других входов, —
    # мусорная и отбрасывается; откат больше stamp_max_lag (с) — возможная смена отсчёта времени.
    # stamp_resync_count согласованных таких меток подряд — переход на новый отсчёт
    stamp_max_lead: 5.0
    stamp_max_lag: 5.0
    stamp_resync_count: 5

    # --- Публикация ---
    # Публикация идёт по сообщениям контроллера (~20 Гц); если он молчит дольше
    # этого времени (с, по времени bag) — по сообщениям колёс (~9,4 Гц)
    driver_cmd_timeout: 0.15
    # Системы координат в /result/position (header.frame_id и child_frame_id)
    frame_id: "map"
    child_frame_id: "base_link"

    # --- Синхронизация по времени ---
    # Метка результата — метка сообщения контроллера, а последнее измерение колёс к этому моменту
    # старше на 40–150 мс. Измерение пересчитывается по ускорению на момент (метка − speed_time_offset).
    # Подбор по 86 прогонам с GNSS: лучший speed_time_offset = 0.0 с — RMSE скорости 0,145 → 0,136 м/с,
    # смещение на разгоне −0,067 → +0,003 м/с, на торможении +0,072 → +0,007 м/с
    wheel_time_alignment: true
    speed_time_offset: 0.0

    # --- Положение по редким точкам GNSS в середине маршрута ---
    # ТЗ (PDF, «Модуль приёма и предобработки данных»): GNSS допускается «для начальной выставки
    # и коррекции»; в bag стенда такие точки в середине маршрута есть. false (или аргумент launch
    # gnss_correction:=false) — GNSS только для начальной выставки
    # backup_model: каждая точка со status ≥ 2 уточняет место на карте модели вдоль пути
    # (фильтр Калмана, σ точки 1,5 м) и при ошибке выбора ветки на стрелке — ветку;
    # wheel_baseline: коррекция места на кольце route_map не чаще раза в gnss_correction_interval с
    gnss_correction: true
    gnss_correction_interval: 1.0

    # --- Положение для wheel_baseline: карта маршрута и привязка по GNSS ---
    # (backup_model использует свою карту пути из пакета tram_backup_odometry)
    # Карта — замкнутое кольцо маршрута (config/route_map.csv, строится tools/build_route_map.py
    # из GNSS обучающих прогонов). "" — карта из пакета; "none" — без карты (путь по прямой)
    route_map_file: ""
    # Приёмник GNSS, первая точка которого — начало координат результата, а точки — привязка
    # к карте (master или rover; если его точек нет — берётся другой); антенны разнесены
    # на 12,4 м вдоль трамвая
    reference_antenna: "master"
    # Остановки (config/route_stops.csv, строятся вместе с картой): места, где трамваи стабильно
    # стоят (27 мест, разброс ~1 м). На стоянке дольше stop_min_duration, если путь уже неточен
    # (σ > 3 м), место на кольце уточняется по ближайшей остановке. "" — файл из пакета, "none" — без них
    route_stops_file: ""
    stop_correction: true
    stop_min_duration: 3.0

    # --- Оценщики ---
    # Запасной оценщик при расхождении тележек: тележка с почти нулевой скоростью игнорируется,
    # иначе берётся та, что ближе к прогнозу скорости. Расхождение дольше этого времени (с) —
    # отказ датчика, берётся большая скорость (настоящие проскальзывания в данных — не дольше 1,7 с)
    bogie_mismatch_max_duration: 3.0
    # Без данных колёс скорость удерживается wheel_hold_max (с), затем снижается
    # с постоянной времени wheel_decay_tau (с), чтобы путь не «убегал» при долгом отказе датчиков
    wheel_hold_max: 2.0
    wheel_decay_tau: 5.0
    # Скорость от оценщика выше этого значения (м/с) или не число — сбой, результат берётся у запасного
    max_output_speed: 30.0

    # --- Диагностика ---
    # Период публикации /diagnostics, с (0.0 — выключить)
    diagnostics_period: 1.0
    # Период вывода статуса в лог, с (0.0 — выключить)
    status_period: 5.0
